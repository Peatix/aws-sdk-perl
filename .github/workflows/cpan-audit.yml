name: cpan-audit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.36"

      - name: Install CPAN::Audit
        run: cpanm --notest CPAN::Audit

      - name: Run cpan-audit
        run: cpan-audit deps .
