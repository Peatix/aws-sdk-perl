name: generate-and-pr
on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Base branch for the generated-code pull request
        required: true
        default: master
      pull_boto_develop:
        description: Pull latest botocore develop before generation
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_branch }}

      - name: Fetch botocore data (post-stack18 — submodule removed)
        # PR 18 (stack18) replaced the botocore submodule. The
        # generator still reads from `botocore/botocore/data/`. Use
        # the `develop` ref to mirror the old `make pull-boto-develop`
        # behaviour by default; `pull_boto_develop=false` could fall
        # back to a pinned tag in a follow-up.
        if: hashFiles('.gitmodules') == ''
        uses: actions/checkout@v6
        with:
          repository: boto/botocore
          ref: develop
          path: botocore

      - name: Set up Perl + dependencies
        uses: ./.github/actions/setup-paws-perl
        with:
          perl-version: "5.36"
          install-modules: |
            App::cpanminus
            Carton
            Data::Printer
            Perl::Tidy
            Pod::HTML2Pod
            Template

      - name: Update botocore (legacy submodule path)
        if: ${{ inputs.pull_boto_develop && hashFiles('.gitmodules') != '' }}
        run: |
          make pull-other-sdks
          make pull-boto-develop

      - name: Generate classes
        run: |
          make gen-classes

      - name: Commit regenerated classes
        id: commit
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          branch="automation/generated-code-${RUN_ID}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "${branch}"

          if git diff --quiet HEAD -- && [ -z "$(git status --porcelain)" ]
          then
            printf 'has_changes=false\n' >> "${GITHUB_OUTPUT}"
            printf 'no changes to commit; skipping pull request\n'
            exit 0
          fi

          git add -A
          git commit -m 'Regenerate generated AWS SDK classes'
          git push origin "${branch}"

          printf 'has_changes=true\n' >> "${GITHUB_OUTPUT}"
          printf 'branch=%s\n' "${branch}" >> "${GITHUB_OUTPUT}"

      - name: Open draft pull request
        if: steps.commit.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          HEAD_BRANCH: ${{ steps.commit.outputs.branch }}
        with:
          script: |
            const { BASE_BRANCH, HEAD_BRANCH } = process.env;
            const body = [
              '## Summary',
              '- regenerate generated SDK classes via `make gen-classes`',
              `- triggered from \`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\``,
            ].join('\n');

            const { data: pull } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              base:  BASE_BRANCH,
              head:  HEAD_BRANCH,
              title: 'Regenerate generated AWS SDK classes',
              body,
              draft: true,
            });

            await github.rest.issues.addLabels({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: pull.number,
              labels:       ['automated'],
            });

            core.notice(`Opened draft pull request #${pull.number}: ${pull.html_url}`);
