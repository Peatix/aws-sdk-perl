name: benchmark-capture

# Master-only: after each merge to master, runs the benchmark suite
# and opens a follow-up PR that updates benchmarks/baseline.json with
# the new numbers. The PR-side benchmarks workflow (see
# benchmarks.yml) compares each PR against this committed baseline.
#
# Why a follow-up PR rather than an auto-commit:
#   - keeps every change to baseline.json reviewable,
#   - avoids race conditions with concurrent merges,
#   - matches the project's existing pattern for bot-driven updates.

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve pinned botocore SHA
        # Pin the upstream checkout to the SHA that auto-lib/ was
        # generated against (see share/botocore/.upstream-sha) so the
        # captured baseline isn't perturbed by botocore HEAD churn.
        # Mirrors the pattern in test.yml + regen-byte-identical.yml.
        if: hashFiles('.gitmodules') == ''
        id: botocore-pin
        run: |
          set -eu
          sha=$(tr -d '[:space:]' < share/botocore/.upstream-sha)
          if [ -z "$sha" ]
          then
            echo "error: share/botocore/.upstream-sha is empty"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Fetch botocore data (post-stack18 — submodule removed)
        if: hashFiles('.gitmodules') == ''
        uses: actions/checkout@v6
        with:
          repository: boto/botocore
          ref: ${{ steps.botocore-pin.outputs.sha }}
          path: botocore

      - name: Set up Perl + dependencies
        uses: ./.github/actions/setup-paws-perl
        with:
          perl-version: "5.36"
          # benchmarks/run-all uses JSON::XS directly; the rest is
          # cpanfile-managed via carton install.
          install-modules: |
            App::cpanminus
            Carton
            JSON::XS

      - name: Run benchmarks
        run: |
          mkdir -p .ci-out
          carton exec -- benchmarks/run-all --iterations 5 --output .ci-out/benchmarks-current.json
        env:
          PAWS_SILENCE_UNSTABLE_WARNINGS: 1
          PERL5LIB: lib:auto-lib

      - name: Compare to current baseline
        run: |
          carton exec -- benchmarks/compare benchmarks/baseline.json .ci-out/benchmarks-current.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Diff vs committed baseline
        id: diff
        run: |
          set -eu
          # Only open a PR if the captured numbers diverge from the
          # committed baseline outside of measurement noise.
          if carton exec -- benchmarks/compare \
              --tolerance 5.0 \
              benchmarks/baseline.json \
              .ci-out/benchmarks-current.json > /dev/null
          then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update committed baseline
        if: steps.diff.outputs.needs_update == 'true'
        run: |
          cp .ci-out/benchmarks-current.json benchmarks/baseline.json

      - name: Create branch + commit refreshed baseline
        if: steps.diff.outputs.needs_update == 'true'
        id: commit
        env:
          BRANCH_NAME: bot/benchmark-baseline-refresh
          COMMIT_MESSAGE: "benchmarks: refresh baseline from master CI"
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet HEAD -- && [ -z "$(git status --porcelain)" ]
          then
            printf 'has_changes=false\n' >> "${GITHUB_OUTPUT}"
            printf 'no changes to commit; skipping pull request\n'
            exit 0
          fi

          git checkout -b "${BRANCH_NAME}"
          git add -A
          git commit -m "${COMMIT_MESSAGE}"
          # Force-push so a previous run's stale branch is overwritten;
          # this matches peter-evans' single-branch reuse semantics
          # (delete-branch: true). When a PR is already open against
          # the branch the existing PR auto-updates with the new commit.
          git push --force origin "${BRANCH_NAME}"

          printf 'has_changes=true\n'           >> "${GITHUB_OUTPUT}"
          printf 'branch=%s\n' "${BRANCH_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Open / update baseline-refresh pull request
        if: steps.commit.outputs.has_changes == 'true'
        uses: actions/github-script@v8
        env:
          BASE_BRANCH: master
          HEAD_BRANCH: ${{ steps.commit.outputs.branch }}
          PR_TITLE: "benchmarks: refresh baseline from master CI"
          PR_BODY: |
            Auto-generated by `.github/workflows/benchmark-capture.yml`.

            The most recent master push produced benchmark numbers
            outside the 5% tolerance vs the committed baseline. This
            PR refreshes `benchmarks/baseline.json` so subsequent
            PR-side `benchmarks` runs measure against the new
            steady-state.

            See `benchmarks/RESULTS.md` for context.
        with:
          script: |
            const { BASE_BRANCH, HEAD_BRANCH, PR_TITLE, PR_BODY } = process.env;

            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              head:  `${context.repo.owner}:${HEAD_BRANCH}`,
              base:  BASE_BRANCH,
              state: 'open',
            });

            if (existing.length > 0) {
              const pr = existing[0];
              core.notice(`Updated existing pull request #${pr.number}: ${pr.html_url}`);
              return;
            }

            const { data: pull } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              base:  BASE_BRANCH,
              head:  HEAD_BRANCH,
              title: PR_TITLE,
              body:  PR_BODY,
            });

            core.notice(`Opened pull request #${pull.number}: ${pull.html_url}`);

      - name: Upload benchmarks-current.json
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmarks-current
          path: .ci-out/benchmarks-current.json
          retention-days: 90
