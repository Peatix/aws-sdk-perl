name: test
on:
  pull_request:
    paths:
      - 'auto-lib/**'
      - 'builder-lib/**'
      - 'lib/**'
      - 'script/**'
      - 't/**'
      - 'cpanfile'
      - 'Makefile'
      - '.github/workflows/test.yml'
      - '.github/workflows/generate-and-pr.yml'
      - '.github/workflows/package.yml'

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Perl 5.36
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.36"
          install-modules-with: cpm
          install-modules: |
            App::cpanminus
            Carton

      - name: Install dependencies
        run: |
          carton install

      - name: Generate classes
        run: |
          services=(
            ApiGateway
            AutoScaling
            Batch
            CloudFormation
            CloudFront
            CloudTrail
            CloudWatch
            CloudWatchLogs
            CognitoIdentity
            DynamoDB
            EC2
            EFS
            ELB
            ES
            ElasticBeanstalk
            Glacier
            IAM
            ImportExport
            MachineLearning
            MQ
            RDS
            RedShift
            Route53
            Route53Domains
            S3
            SDB
            SES
            SNS
            SQS
            SSM
            STS
            Support
          )

          service_files=()
          for service in "${services[@]}"
          do
            latest_service_file="$(
              SERVICE_NAME="${service}" python3 <<'PY'
              import json
              import pathlib
              import re
              import os

              wanted = os.environ["SERVICE_NAME"]

              def normalize(value):
                  return re.sub(r"[^a-z0-9]", "", value.lower())

              target = normalize(wanted)
              candidates = []
              data_root = pathlib.Path("botocore/botocore/data")

              for service_dir in sorted(data_root.iterdir()):
                  if not service_dir.is_dir():
                      continue

                  versions = sorted(service_dir.glob("*/service-2.json"))
                  if not versions:
                      continue

                  latest = versions[-1]
                  try:
                      metadata = json.loads(latest.read_text()).get("metadata", {})
                  except Exception:
                      continue

                  names = [
                      service_dir.name,
                      metadata.get("serviceId", ""),
                      metadata.get("serviceFullName", ""),
                      metadata.get("serviceAbbreviation", ""),
                      metadata.get("endpointPrefix", ""),
                      metadata.get("signingName", ""),
                  ]
                  normalized_names = {normalize(name) for name in names if name}
                  if target in normalized_names:
                      candidates.append(str(latest))

              if not candidates:
                  print("")
              else:
                  print(sorted(candidates, key=len)[0])
              PY
            )"

            if [ -z "${latest_service_file}" ]
            then
              echo "missing_service_definition=${service}"
              exit 1
            fi

            service_files+=("${latest_service_file}")
          done

          carton exec -- ./builder-bin/gen_classes.pl --paws_pm --classes "${service_files[@]}"

      - name: Test
        run: |
          carton exec -- prove -l -j2 t
        env:
          AUTHOR_TESTING: 1
          PAWS_SILENCE_UNSTABLE_WARNINGS: 1
