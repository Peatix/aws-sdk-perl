name: test
on:
  pull_request:
    paths:
      - 'auto-lib/**'
      - 'builder-lib/**'
      - 'lib/**'
      - 'script/**'
      - 't/**'
      - 'cpanfile'
      - 'Makefile'
      - '.github/workflows/test.yml'
      - '.github/workflows/generate-and-pr.yml'
      - '.github/workflows/package.yml'

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Perl 5.36
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.36"
          install-modules-with: cpm
          install-modules: |
            App::cpanminus
            Carton
            Paws

      - name: Install dependencies
        run: |
          carton install

      - name: Generate classes
        run: |
          if [ ! -f botocore/botocore/data/_endpoints.json ]
          then
            if [ -f botocore/botocore/data/endpoints.json ]
            then
              cp botocore/botocore/data/endpoints.json botocore/botocore/data/_endpoints.json
            elif [ -f botocore/botocore/data/endpoints-2.json ]
            then
              cp botocore/botocore/data/endpoints-2.json botocore/botocore/data/_endpoints.json
            else
              printf '%s\n' '{"partitions":[]}' > botocore/botocore/data/_endpoints.json
            fi
          fi

          services=(
            ApiGateway
            AutoScaling
            Batch
            CloudFormation
            CloudFront
            CloudTrail
            CloudWatch
            CognitoIdentity
            DynamoDB
            EC2
            EFS
            ELB
            ES
            ElasticBeanstalk
            Glacier
            IAM
            MachineLearning
            MQ
            RDS
            RedShift
            Route53
            Route53Domains
            SDB
            SES
            SNS
            SQS
            SSM
            STS
            Support
          )

          service_files=()
          for service in "${services[@]}"
          do
            latest_service_file="$(python3 .github/scripts/resolve-botocore-service-file.py --service "${service}")"

            if [ -z "${latest_service_file}" ]
            then
              echo "missing_service_definition=${service}"
              exit 1
            fi

            documentation_file="${latest_service_file/service-2.json/documentation-1.json}"
            if [ ! -f "${documentation_file}" ]
            then
              printf '%s\n' '{"documentation":{"api_url":"","methods":{}}}' > "${documentation_file}"
            fi

            service_files+=("${latest_service_file}")
          done

          carton exec -- ./builder-bin/gen_classes.pl --paws_pm --classes "${service_files[@]}"

      - name: Test
        run: |
          carton exec -- prove -l -j2 t
        env:
          AUTHOR_TESTING: 1
          PAWS_SILENCE_UNSTABLE_WARNINGS: 1
