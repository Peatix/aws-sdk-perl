# by Peatix, Inc. See the git log for this file for details of changes.

name: test
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'builder-lib/**'
      - 'share/**'
      - 'script/**'
      - 't/**'
      - 'cpanfile'
      - 'Makefile'
      - 'etc/_endpoints.json'
      - '.github/workflows/test.yml'
      - '.github/workflows/package.yml'

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# PR 19 (stack19) removed auto-lib/. The previous test pipeline had a
# build-autolib-plan -> build-autolib-shard (matrix a..f) ->
# build-autolib-merge fan-out that regenerated the 49,841 .pm files
# on cache miss; that whole stage is gone. Service classes are now
# materialised on demand from share/smithy/ + share/botocore/, so
# the test job has no upstream dependency.
#
# Scope (post-stack19): the materialiser path is solid for the
# curated `make test-shard` subset (shape-coercion, wire-layer,
# synthetic-protocol, region/timeout/retry-policy tests). Tests that
# exercise the full real-AWS response decoding surface
# (t/05_service_calls.t, t/10_responses.t, t/glacier/, t/route53/,
# t/s3/, ...) need follow-up materialiser work for some shape
# patterns and are intentionally excluded from script/test-shard
# until stack20 widens coverage.

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Don't cancel sibling cells when one fails - surfacing every
      # failure on a single PR review pass is more useful than
      # short-circuiting.
      fail-fast: false
      matrix:
        # Shard names are interpreted by `script/test-shard`. Adding
        # / renaming / re-balancing shards is a script-side change;
        # this YAML only knows the names.
        shard:
          - load-a
          - load-b
          - network
          - mocked
          - subdirs
          - s3

    name: test (${{ matrix.shard }})

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve pinned botocore SHA
        # PR 18 (stack18) removed the botocore submodule; the
        # smithy-only-vendor stack (PR #83) moved the pin from
        # share/botocore/.upstream-sha to etc/botocore-pin.sha.
        # PR 19 (stack19) removed auto-lib/. The materialiser falls
        # back to botocore/botocore/data/<svc>/<date>/service-2.json
        # for services that don't have a Smithy IR yet, so populate
        # the checkout from the pinned upstream SHA below.
        if: hashFiles('.gitmodules') == ''
        id: botocore-pin
        run: |
          set -eu
          sha=$(tr -d '[:space:]' < etc/botocore-pin.sha)
          if [ -z "$sha" ]
          then
            echo "error: etc/botocore-pin.sha is empty"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Fetch botocore data (post-stack18 — submodule removed)
        if: hashFiles('.gitmodules') == ''
        uses: actions/checkout@v6
        with:
          repository: boto/botocore
          ref: ${{ steps.botocore-pin.outputs.sha }}
          path: botocore

      - name: Set up Perl + dependencies
        uses: ./.github/actions/setup-paws-perl
        with:
          perl-version: "5.36"
          # No autolib cache - auto-lib/ is gone post-stack19, so
          # the autolib cache key from the PR #69 / PR #70 pipeline
          # is no longer relevant. Carton cache stays on; carton
          # itself is what makes `make test-shard` (which delegates
          # to `prove --lib -I builder-lib`) find the dep tree.
          cache-autolib: "false"

      - name: Test
        run: |
          make test-shard SHARD=${{ matrix.shard }}
        env:
          PAWS_SILENCE_UNSTABLE_WARNINGS: 1
