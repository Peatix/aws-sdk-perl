name: test
on:
  pull_request:
    paths:
      - 'auto-lib/**'
      - 'builder-lib/**'
      - 'lib/**'
      - 'script/**'
      - 't/**'
      - 'cpanfile'
      - 'Makefile'
      - 'etc/_endpoints.json'
      - '.github/workflows/test.yml'
      - '.github/workflows/generate-and-pr.yml'
      - '.github/workflows/package.yml'

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: regenerate (or restore) auto-lib once and ship it to the
  # matrix as a workflow artifact. Doing the regen in a single job
  # avoids paying the 25-30 minute gen-classes-no-doc-fetch cost N
  # times on cache-miss PRs (touching builder-lib/, templates/, or
  # the share/botocore/.upstream-sha marker).
  build-autolib:
    runs-on: ubuntu-latest
    outputs:
      autolib-cache-hit: ${{ steps.perl.outputs.autolib-cache-hit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve pinned botocore SHA
        # PR 18 (stack18) removed the botocore submodule. The test
        # workflow regenerates auto-lib via `make
        # gen-classes-no-doc-fetch`, so the upstream checkout must
        # be deterministic — fetching `develop` HEAD breaks the
        # build whenever upstream introduces a service / protocol
        # the Builder doesn't yet support (e.g. smithyrpc-v2-cbor
        # post 1.38.19). We pin to the same SHA the committed
        # auto-lib was generated against; updates land via
        # generate-and-pr.yml + the marker file.
        if: hashFiles('.gitmodules') == ''
        id: botocore-pin
        run: |
          set -eu
          sha=$(tr -d '[:space:]' < share/botocore/.upstream-sha)
          if [ -z "$sha" ]
          then
            echo "error: share/botocore/.upstream-sha is empty"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Fetch botocore data (post-stack18 — submodule removed)
        # PR 18 (stack18) removed the botocore submodule; the
        # generator still reads from `botocore/botocore/data/` so we
        # populate it from the pinned upstream SHA here. Once the
        # generator is taught to read share/botocore/ directly this
        # step can go away.
        if: hashFiles('.gitmodules') == ''
        uses: actions/checkout@v6
        with:
          repository: boto/botocore
          ref: ${{ steps.botocore-pin.outputs.sha }}
          path: botocore

      - name: Set up Perl + dependencies
        id: perl
        uses: ./.github/actions/setup-paws-perl
        with:
          perl-version: "5.36"
          # cache-autolib is the first-write cache populator for the
          # test matrix; on cache-miss this job runs gen-classes,
          # then the cache-action's post step writes the result so
          # subsequent runs hit warm cache.
          cache-autolib: "true"

      - name: Generate classes
        if: steps.perl.outputs.autolib-cache-hit != 'true'
        run: |
          make gen-classes-no-doc-fetch
        env:
          PAWS_SILENCE_UNSTABLE_WARNINGS: 1

      - name: Pack auto-lib for matrix download
        # 52k tiny .pm files compress from ~250 MB to ~22 MB. Tarring
        # before upload-artifact is essential — upload-artifact's
        # per-file overhead makes raw uploads of 52k files take
        # multiple minutes; a single tarball is seconds.
        run: |
          tar --create --gzip --file auto-lib.tar.gz auto-lib

      - name: Upload auto-lib artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-lib
          path: auto-lib.tar.gz
          retention-days: 1
          if-no-files-found: error

  test:
    needs: build-autolib
    runs-on: ubuntu-latest

    strategy:
      # Don't cancel sibling cells when one fails — surfacing every
      # failure on a single PR review pass is more useful than
      # short-circuiting.
      fail-fast: false
      matrix:
        # Shard names are interpreted by `script/test-shard`. Adding
        # / renaming / re-balancing shards is a script-side change;
        # this YAML only knows the names.
        shard:
          - load-a
          - load-b
          - network
          - responses
          - mocked
          - subdirs

    name: test (${{ matrix.shard }})

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Perl + dependencies
        uses: ./.github/actions/setup-paws-perl
        with:
          perl-version: "5.36"
          # No autolib cache — we download the artifact built by the
          # `build-autolib` job below. Carton cache stays on; carton
          # itself is what makes `make test-shard` (which delegates
          # to `prove --lib -I auto-lib`) find the dep tree.
          cache-autolib: "false"

      - name: Download auto-lib artifact
        uses: actions/download-artifact@v4
        with:
          name: auto-lib

      - name: Unpack auto-lib
        run: |
          tar --extract --gzip --file auto-lib.tar.gz
          rm auto-lib.tar.gz

      - name: Test
        run: |
          make test-shard SHARD=${{ matrix.shard }}
        env:
          PAWS_SILENCE_UNSTABLE_WARNINGS: 1
