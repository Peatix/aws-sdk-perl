name: test
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'builder-lib/**'
      - 'share/**'
      - 'script/**'
      - 't/**'
      - 'cpanfile'
      - 'Makefile'
      - 'etc/**'
      - '.github/workflows/test.yml'
      - '.github/workflows/package.yml'

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Service classes are materialised on demand from the vendored Smithy
# IR in share/smithy/; there is no ahead-of-time build stage.
#
# Scope: the materialiser path is solid for the curated
# `make test-shard` subset (shape-coercion, wire-layer,
# synthetic-protocol, region/timeout/retry-policy tests).

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Don't cancel sibling cells when one fails - surfacing every
      # failure on a single PR review pass is more useful than
      # short-circuiting.
      fail-fast: false
      matrix:
        # Shard names are interpreted by `script/test-shard`. Adding
        # / renaming / re-balancing shards is a script-side change;
        # this YAML only knows the names.
        shard:
          - load-a
          - load-b
          - network
          - mocked
          - subdirs
          - s3
          - build

    name: test (${{ matrix.shard }})

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Perl + dependencies
        uses: ./.github/actions/setup-paws-perl
        with:
          perl-version: "5.36"
          # No autolib cache - auto-lib/ is gone post-stack19, so
          # the autolib cache key from the PR #69 / PR #70 pipeline
          # is no longer relevant. Carton cache stays on; carton
          # itself is what makes `make test-shard` (which delegates
          # to `prove --lib -I builder-lib`) find the dep tree.
          cache-autolib: "false"

      - name: Test
        run: |
          make test-shard SHARD=${{ matrix.shard }}
        env:
          PAWS_SILENCE_UNSTABLE_WARNINGS: 1
