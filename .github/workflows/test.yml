name: test
on:
  pull_request:
    paths:
      - 'auto-lib/**'
      - 'builder-lib/**'
      - 'lib/**'
      - 'script/**'
      - 't/**'
      - 'cpanfile'
      - 'Makefile'
      - 'etc/_endpoints.json'
      - '.github/workflows/test.yml'
      - '.github/workflows/generate-and-pr.yml'
      - '.github/workflows/package.yml'

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Perl + dependencies
        id: perl
        uses: ./.github/actions/setup-paws-perl
        with:
          perl-version: "5.36"
          # Test workflow regenerates classes; cache the output so
          # PRs that don't touch builder-lib / templates / botocore
          # skip the multi-minute gen-classes step.
          cache-autolib: "true"

      - name: Generate classes
        if: steps.perl.outputs.autolib-cache-hit != 'true'
        run: |
          make gen-classes-no-doc-fetch
        env:
          PAWS_SILENCE_UNSTABLE_WARNINGS: 1

      - name: Test
        run: |
          make test
        env:
          PAWS_SILENCE_UNSTABLE_WARNINGS: 1
