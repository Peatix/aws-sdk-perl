name: benchmarks
on:
  pull_request:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

# Informational gate. Surfaces perf drift in PR review without blocking
# the build. Move --strict on `benchmarks/compare` to true once we
# have confidence in the noise floor (or move to a self-hosted runner).

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve pinned botocore SHA
        # Pin the upstream checkout to the SHA that auto-lib/ was
        # generated against (see etc/botocore-pin.sha) so benchmarks
        # aren't broken by botocore HEAD introducing a service /
        # protocol the Builder doesn't yet support. Mirrors the
        # pattern in test.yml + regen-byte-identical.yml.
        if: hashFiles('.gitmodules') == ''
        id: botocore-pin
        run: |
          set -eu
          sha=$(tr -d '[:space:]' < etc/botocore-pin.sha)
          if [ -z "$sha" ]
          then
            echo "error: etc/botocore-pin.sha is empty"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Fetch botocore data (post-stack18 — submodule removed)
        # script/gen-service in the next step reads from
        # botocore/botocore/data/. Pre-stack18 this came from the
        # submodule; post-stack18 we fetch it on the fly at the pinned
        # SHA resolved above.
        if: hashFiles('.gitmodules') == ''
        uses: actions/checkout@v6
        with:
          repository: boto/botocore
          ref: ${{ steps.botocore-pin.outputs.sha }}
          path: botocore

      - name: Set up Perl + dependencies
        uses: ./.github/actions/setup-paws-perl
        with:
          perl-version: "5.36"
          # The benchmarks driver uses JSON::XS directly (not via the
          # JSON::MaybeXS abstraction), so install it explicitly. The
          # cpanfile-managed deps cover File::Slurper / JSON::MaybeXS
          # via carton install.
          install-modules: |
            App::cpanminus
            Carton
            JSON::XS

      - name: Generate DynamoDB service classes
        # The benchmarks decode a DynamoDB Query response, so we need
        # auto-lib/Paws/DynamoDB.pm + nested classes. Use the
        # single-service generator instead of `make gen-classes` so
        # the benchmarks workflow stays under a couple of minutes.
        run: |
          carton exec -- script/gen-service DynamoDB
        env:
          PAWS_SILENCE_UNSTABLE_WARNINGS: 1

      - name: Run benchmarks
        # Invoke perl with explicit -I for lib + auto-lib (the in-tree
        # Paws code being benchmarked). `carton exec` handles
        # local/lib/perl5 (cpanfile-managed deps like File::Slurper /
        # JSON::MaybeXS). Setting PERL5LIB at the step level here
        # would clobber the `local/lib/perl5` path that the setup
        # action put in PERL5LIB, and the parent perl process running
        # `local/bin/carton` would fail with "Can't locate Carton/CLI.pm".
        run: |
          mkdir -p .ci-out
          carton exec -- perl -Ilib -Iauto-lib benchmarks/run-all --iterations 5 --output .ci-out/benchmarks-current.json
        env:
          PAWS_SILENCE_UNSTABLE_WARNINGS: 1

      - name: Compare to baseline
        # PR 17 flipped --strict on. The baseline is now refreshed
        # automatically by .github/workflows/benchmark-capture.yml on
        # master pushes, so PRs can fail the build on perf regressions
        # beyond the 25% tolerance.
        run: |
          carton exec -- benchmarks/compare --strict benchmarks/baseline.json .ci-out/benchmarks-current.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmarks-current.json
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmarks-current
          path: .ci-out/benchmarks-current.json
          retention-days: 90
