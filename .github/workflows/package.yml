name: package
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package (branch, tag, or commit SHA)
        required: true
        default: master
  push:
    tags:
      - 'release-*'
      - 'v*'

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Fetch botocore data (post-stack18 — submodule removed)
        # `make dist` itself doesn't need botocore, but a release built
        # from a fresh checkout that wants to re-run `make gen-classes`
        # before packaging would. Keep this step here so the workflow
        # works against either the pre- or post-stack18 layout.
        if: hashFiles('.gitmodules') == ''
        uses: actions/checkout@v6
        with:
          repository: boto/botocore
          ref: develop
          path: botocore

      - name: Set up Perl + dependencies
        uses: ./.github/actions/setup-paws-perl
        with:
          perl-version: "5.36"

      - name: Build distribution archive
        run: |
          make dist

      - name: Generate checksums
        run: |
          shasum -a 256 Paws-*.tar.gz > SHA256SUMS

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: paws-dist-${{ github.run_id }}
          path: |
            Paws-*.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30
