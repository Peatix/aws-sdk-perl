name: package
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package (branch, tag, or commit SHA)
        required: true
        default: master
  push:
    tags:
      - 'release-*'
      - 'v*'

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up Perl 5.36
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.36"
          install-modules-with: cpm
          install-modules: |
            App::cpanminus
            Carton

      - name: Install repository dependencies
        run: |
          carton install

      - name: Build distribution archive
        run: |
          make dist

      - name: Generate checksums
        run: |
          shasum -a 256 Paws-*.tar.gz > SHA256SUMS

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: paws-dist-${{ github.run_id }}
          path: |
            Paws-*.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30
