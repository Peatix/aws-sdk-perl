name: coverage
on:
  pull_request:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  coverage:
    # Defensive 30-min cap from PR #65: even with the cover-ci scope
    # fixes that brought this job back under budget, future drift
    # (e.g. a new test that preloads all services) could cause hangs
    # again. The cap keeps the runner free in that case.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Perl 5.36
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.36"
          install-modules-with: cpm
          install-modules-args: --without-develop
          install-modules: |
            Template
            Pod::HTML2Pod
            Perl::Tidy
            Carp::Always
            Devel::Cover
            Data::Printer
            Carp::Always
            Test::Pod
            Devel::CoverReport
            JSON::MaybeXS

      - name: Run test suite under Devel::Cover
        # Scope of cover-ci is intentionally narrower than `make test`:
        # see Makefile cover-ci comment / docs/testing.md "Scope of
        # cover-ci" for the rationale (skip 01_load.t / 99_pod_*.t,
        # +ignore auto-lib/ and t/ from Devel::Cover). AUTHOR_TESTING
        # is not set: t/99_pod_*.t are POD validation gates, not
        # lib/ statement-coverage signal.
        run: make cover-ci
        env:
          PAWS_SILENCE_UNSTABLE_WARNINGS: 1

      - name: Generate coverage summary JSON
        run: cover -report json -outputdir cover_db || true

      - name: Render coverage table
        id: summary
        run: |
          set -eu
          script/coverage-summary --output coverage-current.json
          script/coverage-summary --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Compare to baseline
        run: script/coverage-compare coverage-baseline.json coverage-current.json

      - name: Upload cover_db artefact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cover_db
          path: cover_db/
          retention-days: 14

      - name: Upload coverage-current.json
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-current
          path: coverage-current.json
          retention-days: 90
