name = Paws
author = Jose Luis Martinez <jlmartinez@capside.com>
license = Apache_2_0
copyright_holder = Jose Luis Martinez
copyright_year = 2014
main_module = lib/Paws.pm

[VersionFromMainModule]

[Git::GatherDir]
exclude_match    = ^old_t
exclude_filename = TODO
exclude_filename = TODO_in_branch
exclude_match    = ^templates
exclude_match    = ^builder-lib
exclude_match    = ^builder-bin
; share/smithy/*.smithy.json is tracked in git and ships in the dist
; via this gather (see [ShareDir] below).
exclude_match    = ^paws-docs-dist
exclude_filename = Makefile
; LICENSE gets generated by Dist::Zilla, but we want it in
; the source repo so github can detect it 
exclude_filename = LICENSE
; dot not ship internal tools
exclude_filename = bin/paws_make_testcase
exclude_filename = bin/xml2yaml.sh
; etc/botocore-pin.sha is a CI-only marker (see .github/workflows
; that fetch botocore at runtime for the AOT generator); not part
; of the runtime dist.
exclude_filename = etc/botocore-pin.sha

[ExecDir]
dir = script

; Service classes are built on demand by Paws::Model::Materializer
; from the vendored Smithy IR in share/smithy/, so the dist ships
; lib/ + share/ + metadata only (no AOT-generated .pm files).
;
; share/smithy/*.smithy.json is tracked in git and gathered by
; [Git::GatherDir]; [ShareDir] then marks the share/ tree so
; Module::Build::Tiny installs it under File::ShareDir::dist_dir('Paws')
; at install time. Paws::Model::Loader::Resolver looks IR files up
; via File::ShareDir::dist_dir('Paws').
[ShareDir]
dir = share

[ModuleBuildTiny::Fallback]

[@Git]
allow_dirty = dist.ini
allow_dirty = Changes
allow_dirty = README

[Prereqs::FromCPANfile]

[MetaProvides::Package]
[MetaYAML]
[MetaJSON]

[MetaResources]
repository.web = https://github.com/pplu/aws-sdk-perl
repository.url = https://github.com/pplu/aws-sdk-perl.git
repository.type = git
bugtracker.web = https://github.com/pplu/aws-sdk-perl/issues

[License]

[RunExtraTests]
[TestRelease]

[FileFinder::ByName / Examples]
dir = examples

[Manifest]

[Git::Tag]
tag_format  = release-%v

[Git::Push]

[ConfirmRelease]
[UploadToCPAN]
