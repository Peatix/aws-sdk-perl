; This file has been modified from the original upstream distribution
; by Peatix, Inc. See the git log for this file for details of changes.

; Phase 3 of the A4-B distribution plan
; (docs/distribution-plan-a4b.md §2.1 + §2.5).
;
; The dist is named `Paws-Core`; it ships the runtime Paws.pm + wire
; layer + signers + credential providers + IR data classes (no
; service classes, no Smithy IR). Per-service modular sub-dists
; (`Paws-S3`, `Paws-EC2`, ...) declare `requires Paws::Core` and are
; built by script/build-modular-dist + the release-modular workflow
; (Phase 1, 1.5, 2). The materialiser + loader code live in master
; at lib/Paws/Model/{Materializer,Loader}* but are excluded from
; this dist (build-pipeline only).
name = Paws-Core
author = Jose Luis Martinez <jlmartinez@capside.com>
license = Apache_2_0
copyright_holder = Jose Luis Martinez
copyright_year = 2014
main_module = lib/Paws.pm

[VersionFromMainModule]

[Git::GatherDir]
exclude_match    = ^old_t
exclude_filename = TODO
exclude_filename = TODO_in_branch
exclude_match    = ^auto-lib
exclude_match    = ^builder-lib
exclude_match    = ^builder-bin
; Phase 3: drop share/smithy/ from the Paws::Core dist. The IR files
; stay in git (they're inputs to the build pipeline at master HEAD),
; but they no longer ship to end users — sub-dists carry their own
; pre-materialised classes per the A4-B plan §2.1.
exclude_match    = ^share/
; Phase 3: build-time-only modules (materialiser, loaders, IR
; constructor classes). They live in master under lib/Paws/Model/ for
; script/build-modular-dist to consume via -I lib at build time, but
; never ship to end users — Q9 in the plan §2.5 chose Option C
; (drop entirely from any user-facing dist).
exclude_match    = ^lib/Paws/Model/
; Build-pipeline tests for the materialiser / per-service tarball
; tooling. They run in CI from master but don't belong in the Core
; dist's t/ tree.
exclude_match    = ^t/build/
exclude_match    = ^t/model/
exclude_match    = ^paws-docs-dist
exclude_filename = Makefile
; LICENSE gets generated by Dist::Zilla, but we want it in
; the source repo so github can detect it 
exclude_filename = LICENSE
; dot not ship internal tools
exclude_filename = bin/paws_make_testcase
exclude_filename = bin/xml2yaml.sh
; Build-pipeline scripts: script/build-modular-* + audit are
; consumed by .github/workflows/release-modular.yml from master,
; not from a Core install.
exclude_filename = script/build-modular-dist
exclude_filename = script/build-modular-docs-dist
exclude_filename = script/build-all-modular
; etc/botocore-pin.sha is a CI-only marker (see .github/workflows
; that fetch botocore at runtime for the AOT generator); not part
; of the runtime dist.
exclude_filename = etc/botocore-pin.sha

[ExecDir]
dir = script

[ModuleBuildTiny::Fallback]

[@Git]
allow_dirty = dist.ini
allow_dirty = Changes
allow_dirty = README

[Prereqs::FromCPANfile]

[MetaProvides::Package]
[MetaYAML]
[MetaJSON]

[MetaResources]
repository.web = https://github.com/pplu/aws-sdk-perl
repository.url = https://github.com/pplu/aws-sdk-perl.git
repository.type = git
bugtracker.web = https://github.com/pplu/aws-sdk-perl/issues

[License]

[RunExtraTests]
[TestRelease]

[FileFinder::ByName / Examples]
dir = examples

[Manifest]

[Git::Tag]
tag_format  = release-%v

[Git::Push]

[ConfirmRelease]
[UploadToCPAN]
